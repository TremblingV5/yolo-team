        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/yolo-team_yolo-cli_internal_common.Response'
      summary: Delete a document
      tags:
      - Documents
    get:
      description: Get document details by key
      operationId: GetDocument
      parameters:
      - description: Document key
